name: Build APK

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка или тег v2rayNG (по умолчанию master)'
        required: false
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Скачать исходники v2rayNG
        uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          ref: ${{ github.event.inputs.ref || 'master' }}
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Установить Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Android SDK и NDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" || true
          sdkmanager "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"
          sed -i -E 's/ndkVersion *= *"[^"]*"/ndkVersion = "29.0.14206865"/' V2rayNG/app/build.gradle.kts || true

      - name: Нативная библиотека hev-socks5-tunnel
        run: |
          chmod +x compile-hevtun.sh
          ./compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs/. V2rayNG/app/libs/
          ls -R V2rayNG/app/libs | head -40

      - name: Ядро Xray (libv2ray.aar)
        run: |
          cd AndroidLibXrayLite
          git fetch --tags --quiet || true
          TAG=$(git describe --tags --abbrev=0 || true)
          cd ..
          BASE=https://github.com/2dust/AndroidLibXrayLite/releases
          curl -fL -o V2rayNG/app/libs/libv2ray.aar "$BASE/download/$TAG/libv2ray.aar" \
            || curl -fL -o V2rayNG/app/libs/libv2ray.aar "$BASE/latest/download/libv2ray.aar"

      - name: Сборка APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --stacktrace

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
